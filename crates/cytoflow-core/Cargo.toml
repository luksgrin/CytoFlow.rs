[package]
name = "cytoflow-core"
description = "Clean-room flow cytometry analysis core: FCS parsing, transforms, compensation, hierarchical gating, statistics and FlowJo workspace import"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
quick-xml = "0.37"
rayon = "1.10"
csv = "1.3"
rust_xlsxwriter = { version = "0.99", default-features = false, features = ["constant_memory"] }
arrow = { version = "60", default-features = false }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
